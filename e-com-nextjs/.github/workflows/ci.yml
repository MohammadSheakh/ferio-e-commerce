name: CI

on:
  push:
    branches: [main, ox-alpha-saas]
  pull_request:

jobs:
  backend:
    name: Backend — build & tests (incl. cross-tenant integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-nest-prisma

    # Disposable infrastructure: a fresh PostgreSQL and Redis exist only for
    # this job run. The integration suites create/drop their own scratch
    # databases against this server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PLATFORM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      JWT_ACCESS_SECRET: ci-openapi-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: ci-openapi-refresh-secret-012345678901234567890123456789
      # Superuser has CREATEDB — required by the tenant-bootstrap isolation
      # suite, which creates and drops scratch databases per test case.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      # Queue smoke specs demand an isolated non-default port + prefix so a
      # misconfigured run can never touch production queues.
      TEST_REDIS_PORT: "6380"
      TEST_QUEUE_PREFIX: ferio:test:ci

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-nest-prisma/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients (tenant + platform)
        run: pnpm prisma:generate
      - name: Verify backend architecture boundaries
        run: pnpm architecture:check
      - name: Apply tenant database migrations
        run: pnpm prisma:migrate:deploy
      - name: Apply platform database migrations
        run: pnpm prisma:migrate:platform
      - name: Verify committed backend OpenAPI contract
        run: pnpm openapi:check
      - name: Strict typecheck (incl. specs)
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Active application dependency-graph typecheck
        run: pnpm typecheck:application
      - name: Production build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Cross-tenant isolation + bootstrap integration tests
        run: pnpm test:integration
      - name: Tenant capacity baseline evidence
        run: pnpm test:performance
      - name: BullMQ runtime smoke tests
        run: pnpm test:queue-smoke

  security-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  production-compose:
    name: Production Compose — render and exposure checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-com-nextjs
    env:
      POSTGRES_IMAGE: postgres:16@sha256:1111111111111111111111111111111111111111111111111111111111111111
      REDIS_IMAGE: redis:7@sha256:2222222222222222222222222222222222222222222222222222222222222222
      MINIO_IMAGE: minio/minio:latest@sha256:3333333333333333333333333333333333333333333333333333333333333333
      MINIO_MC_IMAGE: minio/mc:latest@sha256:4444444444444444444444444444444444444444444444444444444444444444
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      MINIO_ROOT_USER: ci-minio-user
      MINIO_ROOT_PASSWORD: ci-minio-password
      JWT_ACCESS_SECRET: ci-compose-access-secret
      JWT_REFRESH_SECRET: ci-compose-refresh-secret
      PLATFORM_JWT_SECRET: ci-compose-platform-secret
      PLATFORM_DB_CREDENTIAL_KEY: ci-compose-db-key
      PUBLIC_FERIO_API_URL: https://api.example.test
      PUBLIC_SOCKET_URL: https://api.example.test
      PUBLIC_CUSTOMER_URL: https://shop.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Render production Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - name: Assert production services are not host-published
        run: |
          rendered="$(docker compose -f docker-compose.yml -f docker-compose.production.yml config)"
          if grep -q 'published:' <<<"$rendered"; then
            echo 'Production overlay must not publish container ports directly.' >&2
            exit 1
          fi
          if ! grep -Eq 'NODE_ENV: production' <<<"$rendered"; then
            echo 'Production overlay must set NODE_ENV=production.' >&2
            exit 1
          fi
          if ! grep -Eq 'TENANCY_ENABLED: "?true"?' <<<"$rendered"; then
            echo 'Production overlay must set TENANCY_ENABLED=true.' >&2
            exit 1
          fi
          if ! grep -q 'REDISCLI_AUTH:' <<<"$rendered"; then
            echo 'Production Redis healthcheck must receive REDISCLI_AUTH in-container.' >&2
            exit 1
          fi
      - name: Assert web runtime images are non-root
        run: |
          for dockerfile in ferio-customer-web/Dockerfile ferio-admin-dashboard/ferio-admin/Dockerfile ferio-platform-admin/Dockerfile; do
            if ! grep -q '^USER node$' "$dockerfile"; then
              echo "$dockerfile must declare USER node for its runtime stage." >&2
              exit 1
            fi
          done

  dependency-audit:
    name: Dependency audit (backend + web apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ferio-nest-prisma, ferio-customer-web, ferio-admin-dashboard/ferio-admin, ferio-platform-admin, ferio-mobile-expo54]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - name: Install locked dependencies (${{ matrix.app }})
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.app }}
      - name: Audit production dependencies (${{ matrix.app }})
        run: pnpm audit --prod --audit-level critical
        working-directory: ${{ matrix.app }}

  customer-web:
    name: Customer Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-customer-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-customer-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify committed OpenAPI client schema
        run: pnpm api:check
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_FERIO_API_URL: http://localhost:6733/api/v1

  admin-web:
    name: Admin Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-admin-dashboard/ferio-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-admin-dashboard/ferio-admin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify committed OpenAPI client schema
        run: pnpm api:check
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build

  platform-admin:
    name: Platform Admin — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-platform-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-platform-admin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify committed OpenAPI client schema
        run: pnpm api:check
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-mobile-expo54
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-mobile-expo54/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm typecheck
