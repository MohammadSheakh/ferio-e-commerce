name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-nest-prisma
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-nest-prisma/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients (tenant + platform)
        run: pnpm prisma:generate
      - name: Production build
        run: pnpm build
      - name: Unit tests
        run: pnpm test

  customer-web:
    name: Customer Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-customer-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-customer-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_FERIO_API_URL: http://localhost:6733/api/v1

  admin-web:
    name: Admin Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferio-admin-dashboard/ferio-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ferio-admin-dashboard/ferio-admin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
