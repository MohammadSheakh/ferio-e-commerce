# ─── Full-Stack Ferio Commerce SaaS ───
# Runs all infrastructure + applications. Suitable for demo, alpha, or
# single-server production with a reverse proxy in front.
#
# Quick start:
#   docker compose up -d --build
#   # Backend:  http://localhost:6733/api/v1   (health: /api/v1/health)
#   # Customer: http://localhost:3000
#   # Admin:    http://localhost:3001
#   # Platform: http://localhost:3100
#   # MinIO:    http://localhost:9001  (dev S3 bucket 'ferio-media')
#
# Secrets (JWT/platform keys) are auto-generated on first backend boot and
# persisted in the ferio_secrets volume. Override any of them by exporting:
#   JWT_ACCESS_SECRET / JWT_REFRESH_SECRET / PLATFORM_JWT_SECRET /
#   PLATFORM_DB_CREDENTIAL_KEY / PLATFORM_CALLBACK_SECRET
#
# For production: front everything with a reverse proxy for TLS and set
# TENANCY_ENABLED=true once the wildcard DNS record exists.
#
# NOTE: host port 5433 maps to Postgres 5432 because 5432 is frequently
# occupied by a local system PostgreSQL.

services:
  # ── Infrastructure ──
  postgres:
    image: postgres:16
    container_name: ferio-postgres
    environment:
      POSTGRES_USER: ferio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferio}
      POSTGRES_DB: ferio_dev
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferio"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ferio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Object Storage (S3-compatible dev bucket; prod = Cloudflare R2) ──
  minio:
    image: minio/minio:latest
    container_name: ferio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/ferio-media &&
      echo 'bucket ready: ferio-media'"

  # ── One-shot migrations (complete before the backend starts) ──
  tenant-migrate:
    build:
      context: .
      dockerfile: ferio-nest-prisma/Dockerfile
      target: build
    command: >
      sh -c "node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma"
    environment:
      DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:-ferio}@postgres:5432/ferio_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-migrate:
    build:
      context: .
      dockerfile: ferio-nest-prisma/Dockerfile
      target: build
    command: >
      sh -c "node_modules/.bin/prisma migrate deploy --config prisma/platform.config.ts"
    environment:
      PLATFORM_DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:-ferio}@postgres:5432/ferio_platform
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Backend ──
  backend:
    build:
      context: .
      dockerfile: ferio-nest-prisma/Dockerfile
    container_name: ferio-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      tenant-migrate:
        condition: service_completed_successfully
      platform-migrate:
        condition: service_completed_successfully
    ports:
      - "6733:6733"
      - "6734:6734"
    environment:
      DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:-ferio}@postgres:5432/ferio_dev
      PLATFORM_DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:-ferio}@postgres:5432/ferio_platform
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: development
      TENANCY_ENABLED: ${TENANCY_ENABLED:-false}
      # Only Docker-network BFF/ingress peers may supply x-forwarded-host.
      # Production environments with a narrower subnet should override this.
      TENANT_TRUSTED_PROXY_CIDRS: ${TENANT_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      PORT: "6733"
      SOCKET_PORT: "6734"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-5000}
      DB_POOL_MAX_USES: ${DB_POOL_MAX_USES:-0}
      TENANT_DB_MAX_CLIENTS: ${TENANT_DB_MAX_CLIENTS:-25}
      TENANT_DB_POOL_MAX: ${TENANT_DB_POOL_MAX:-3}
      TENANT_DB_IDLE_TIMEOUT_MS: ${TENANT_DB_IDLE_TIMEOUT_MS:-30000}
      TENANT_DB_ACQUIRE_TIMEOUT_MS: ${TENANT_DB_ACQUIRE_TIMEOUT_MS:-5000}
      TENANT_DB_POOL_MAX_USES: ${TENANT_DB_POOL_MAX_USES:-0}
      TRANSACTIONAL_MESSAGE_PROCESSING_TIMEOUT_MINUTES: ${TRANSACTIONAL_MESSAGE_PROCESSING_TIMEOUT_MINUTES:-30}
      PLATFORM_INITIAL_SUPERADMIN_EMAIL: ${PLATFORM_INITIAL_SUPERADMIN_EMAIL:-owner@ferio.local}
      PLATFORM_INITIAL_SUPERADMIN_PASSWORD: ${PLATFORM_INITIAL_SUPERADMIN_PASSWORD:-}
      PLATFORM_INITIAL_SUPERADMIN_PASSWORD_HASH: ${PLATFORM_INITIAL_SUPERADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_ACCESS_SECRET:-}
      FILE_UPLOAD_STRATEGY: r2
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET: ferio-media
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ferio_secrets:/app/.secrets
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["node", "dist/src/main.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6733/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Customer Web ──
  customer-web:
    build:
      context: ./ferio-customer-web
      dockerfile: Dockerfile
    container_name: ferio-customer-web
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_FERIO_API_URL: ${PUBLIC_FERIO_API_URL:-http://localhost:6733/api/v1}
      FERIO_API_URL: http://backend:6733/api/v1
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:6734}

  # ── Admin Web ──
  admin-web:
    build:
      context: ./ferio-admin-dashboard/ferio-admin
      dockerfile: Dockerfile
    container_name: ferio-admin-web
    depends_on:
      - backend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_FERIO_API_URL: ${PUBLIC_FERIO_API_URL:-http://localhost:6733/api/v1}
      FERIO_API_URL: http://backend:6733/api/v1
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:6734}

  # ── Platform Admin ──
  platform-admin:
    build:
      context: ./ferio-platform-admin
      dockerfile: Dockerfile
    container_name: ferio-platform-admin
    depends_on:
      - backend
    ports:
      - "3100:3000"
    environment:
      PLATFORM_API_URL: http://backend:6733/api/v1

volumes:
  pg_data:
  minio_data:
  ferio_secrets:
