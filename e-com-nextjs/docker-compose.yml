# ─── Full-Stack Ferio Commerce SaaS ───
# Runs all infrastructure + applications. Suitable for demo, alpha, or
# single-server production with a reverse proxy in front.
#
# Quick start:
#   docker compose up -d --build
#   # Backend: http://localhost:6733/api/v1
#   # Customer: http://localhost:3000
#   # Admin:    http://localhost:3001
#   # Platform: http://localhost:3100
#
# For production: use a reverse proxy (Caddy/Traefik/Nginx) for TLS and
# set TENANCY_ENABLED=true once DNS wildcard is configured.

services:
  # ── Infrastructure ──
  postgres:
    image: postgres:16
    container_name: ferio-postgres
    environment:
      POSTGRES_USER: ferio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferio}
      POSTGRES_DB: ferio_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferio"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ferio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend ──
  backend:
    build:
      context: .
      dockerfile: ferio-nest-prisma/Dockerfile
    container_name: ferio-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "6733:6733"
    environment:
      DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:-ferio}@postgres:5432/ferio_dev
      PLATFORM_DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:-ferio}@postgres:5432/ferio_platform
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-jwt-secret-change-in-production-at-least-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-at-least-32}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-dev-platform-secret-change-in-production-32ch}
      PLATFORM_DB_CREDENTIAL_KEY: ${PLATFORM_DB_CREDENTIAL_KEY:-dev-credential-key-change-in-production-32}
      PLATFORM_CALLBACK_SECRET: ${PLATFORM_CALLBACK_SECRET:-dev-callback-secret-change-in-prod-32}
      PLATFORM_INITIAL_SUPERADMIN_EMAIL: ${PLATFORM_INITIAL_SUPERADMIN_EMAIL:-owner@ferio.local}
      PLATFORM_INITIAL_SUPERADMIN_PASSWORD_HASH: ${PLATFORM_INITIAL_SUPERADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_ACCESS_SECRET:-dev-jwt-secret-change-in-production-at-least-32-chars}
      NODE_ENV: development
      TENANCY_ENABLED: ${TENANCY_ENABLED:-false}
      PORT: "6733"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6733/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Customer Web ──
  customer-web:
    build:
      context: .
      dockerfile: ferio-customer-web/Dockerfile
    container_name: ferio-customer-web
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_FERIO_API_URL: http://backend:6733/api/v1
      FERIO_API_URL: http://backend:6733/api/v1

  # ── Admin Web ──
  admin-web:
    build:
      context: .
      dockerfile: ferio-admin-dashboard/ferio-admin/Dockerfile
    container_name: ferio-admin-web
    depends_on:
      - backend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_FERIO_API_URL: http://backend:6733/api/v1

  # ── Platform Admin ──
  platform-admin:
    build:
      context: .
      dockerfile: ferio-platform-admin/Dockerfile
    container_name: ferio-platform-admin
    depends_on:
      - backend
    ports:
      - "3100:3000"
    environment:
      PLATFORM_API_URL: http://backend:6733/api/v1

volumes:
  pg_data:
