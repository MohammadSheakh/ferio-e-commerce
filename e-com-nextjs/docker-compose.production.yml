# Ferio production overlay.
#
# Use with the base service definitions:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Put TLS, public DNS, and rate limiting in the reverse proxy or orchestrator.
# This overlay deliberately exposes application services only to the compose
# network and requires credentials instead of inheriting development defaults.

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be an immutable production image reference}
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be an immutable production image reference}
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE must be an immutable production image reference}
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:?MINIO_MC_IMAGE must be an immutable production image reference}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/ferio-media &&
      echo 'bucket ready: ferio-media'"

  tenant-migrate:
    environment:
      DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ferio_dev

  platform-migrate:
    environment:
      PLATFORM_DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ferio_platform

  backend:
    ports: !reset []
    expose:
      - "6733"
      - "6734"
    environment:
      DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ferio_dev
      PLATFORM_DATABASE_URL: postgresql://ferio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ferio_platform
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NODE_ENV: production
      TENANCY_ENABLED: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET must be set}
      PLATFORM_DB_CREDENTIAL_KEY: ${PLATFORM_DB_CREDENTIAL_KEY:?PLATFORM_DB_CREDENTIAL_KEY must be set}
      # Do not inherit local bootstrap credentials. Create the first operator
      # through a controlled production provisioning procedure instead.
      PLATFORM_INITIAL_SUPERADMIN_PASSWORD: ""
      PLATFORM_INITIAL_SUPERADMIN_PASSWORD_HASH: ""
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    restart: unless-stopped

  customer-web:
    depends_on:
      backend:
        condition: service_healthy
    build:
      args:
        NEXT_PUBLIC_FERIO_API_URL: ${PUBLIC_FERIO_API_URL:?PUBLIC_FERIO_API_URL must be set}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:?PUBLIC_SOCKET_URL must be set}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_CUSTOMER_URL:?PUBLIC_CUSTOMER_URL must be set}
    ports: !reset []
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_FERIO_API_URL: ${PUBLIC_FERIO_API_URL:?PUBLIC_FERIO_API_URL must be set}
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:?PUBLIC_SOCKET_URL must be set}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_CUSTOMER_URL:?PUBLIC_CUSTOMER_URL must be set}
    restart: unless-stopped

  admin-web:
    depends_on:
      backend:
        condition: service_healthy
    build:
      args:
        NEXT_PUBLIC_FERIO_API_URL: ${PUBLIC_FERIO_API_URL:?PUBLIC_FERIO_API_URL must be set}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:?PUBLIC_SOCKET_URL must be set}
    ports: !reset []
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      FERIO_API_URL: http://backend:6733/api/v1
      NEXT_PUBLIC_FERIO_API_URL: ${PUBLIC_FERIO_API_URL:?PUBLIC_FERIO_API_URL must be set}
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:?PUBLIC_SOCKET_URL must be set}
    restart: unless-stopped

  platform-admin:
    depends_on:
      backend:
        condition: service_healthy
    ports: !reset []
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
