# ─── Ferio Commerce SaaS — Development Environment ───
# Provides PostgreSQL (control plane + tenant DBs on same server) and Redis.
# Run your apps natively against these containers.
#
#   docker compose up -d
#
# Then set these env vars in ferio-nest-prisma/.env:
#   DATABASE_URL=postgresql://ferio:ferio@localhost:5433/ferio_dev
#   PLATFORM_DATABASE_URL=postgresql://ferio:ferio@localhost:5433/ferio_platform
#   REDIS_HOST=localhost
#   REDIS_PORT=6379

services:
  postgres:
    image: postgres:16
    container_name: ferio-postgres
    environment:
      POSTGRES_USER: ferio
      POSTGRES_PASSWORD: ferio
      POSTGRES_DB: ferio_dev
      # Additional databases created by init script below
      POSTGRES_MULTIPLE_DATABASES: ferio_platform
    # Host 5433 -> container 5432 (host 5432 frequently occupied by a
    # local system PostgreSQL).
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferio"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ferio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ferio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Creates the ferio-media bucket on first start (S3-compatible dev bucket
  # mirroring production Cloudflare R2 — same API, different endpoint).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ferio-media &&
      echo 'bucket ready: ferio-media'"

volumes:
  pg_data:
  minio_data:
